# Jarvis settings. No secrets in here - those live in secrets.env.

brain:
  host: 127.0.0.1        # localhost only in v1
  port: 8765

llm:
  provider: anthropic    # later: ollama
  model: claude-haiku-5-5
  max_tokens: 1024
  max_steps: 8           # hard cap on tool-loop rounds per command (cost guard)

voice:                   # used from job 3
  listen_mode: wake_word # wake_word | push_to_talk
  wake_word: hey jarvis
  max_record_seconds: 15
  push_to_talk_input: hotkey   # later: hardware button

pc_control:              # used from job 4
  allowed_apps: []
